<svg xmlns="http://www.w3.org/2000/svg" width="430" height="190" viewBox="0 0 430 190" role="img" aria-label="SNU Bid Planner: Reserve-aware bid planner and timetable builder">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbeefa"/><stop offset="1" stop-color="#ece3ff"/></linearGradient>
<linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa6d0" stop-opacity=".95"/><stop offset="1" stop-color="#6aa6d0" stop-opacity=".6"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><rect x="1" y="1" width="428" height="188" rx="22"/></clipPath>
<filter id="bl"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<style>
.fa{animation:fa 8s ease-in-out infinite}.fb{animation:fa 11s ease-in-out -4s infinite}
@keyframes fa{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}
.sh{animation:sh 6.5s ease-in-out infinite}@keyframes sh{0%,55%{transform:translateX(-200px)}100%{transform:translateX(640px)}}
.ic{animation:ic 3.4s ease-in-out infinite}@keyframes ic{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-3deg)}}
.ar{animation:ar 1.6s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.pl{animation:pl 3s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.85}50%{opacity:1}}
.in{animation:inn .9s cubic-bezier(.2,.8,.2,1) both}@keyframes inn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<rect x=".5" y=".5" width="429" height="189" rx="22.5" fill="url(#bg)" stroke="#fff" stroke-opacity=".9"/>
<g clip-path="url(#cl)">
<g class="fa"><circle cx="360" cy="30" r="62" fill="#6aa6d0" opacity=".22" filter="url(#bl)"/></g>
<g class="fb"><circle cx="60" cy="176" r="56" fill="#fff" opacity=".5" filter="url(#bl)"/></g>
<g class="ic" style="transform-box:fill-box;transform-origin:center"><rect x="24" y="22" width="48" height="48" rx="15" fill="url(#ic)" stroke="#fff" stroke-width="2"/><text x="48" y="53" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="800" fill="#fff">SB</text></g>
<g class="in"><text x="86" y="43" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="800" fill="#4f3f7e">SNU Bid Planner</text><text x="86" y="62" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#8a7bb0">snu-scheduler</text></g>
<g class="in" style="animation-delay:.15s"><text x="24" y="104" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#4f3f7e" opacity=".9">Reserve-aware bid planner and timetable builder</text></g>
<g class="pl" style="animation-delay:-0.0s"><rect x="24.0" y="120" width="72.8" height="24" rx="12" fill="#fff" opacity=".75" stroke="#6aa6d0" stroke-opacity=".35"/><text x="60.4" y="136" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#4f3f7e">OR-Tools</text></g>
<g class="pl" style="animation-delay:-0.7s"><rect x="104.8" y="120" width="59.6" height="24" rx="12" fill="#fff" opacity=".75" stroke="#6aa6d0" stroke-opacity=".35"/><text x="134.6" y="136" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#4f3f7e">CP-SAT</text></g>
<g class="pl" style="animation-delay:-1.4s"><rect x="172.4" y="120" width="86.0" height="24" rx="12" fill="#fff" opacity=".75" stroke="#6aa6d0" stroke-opacity=".35"/><text x="215.4" y="136" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#4f3f7e">Scheduling</text></g>
<circle cx="31" cy="166" r="5" fill="#f19cbc"/><text x="42" y="170" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" fill="#8a7bb0">HTML</text>
<g class="ar"><text x="406" y="170" text-anchor="end" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#6aa6d0">view repo  →</text></g>
<g transform="skewX(-18)"><rect class="sh" x="0" y="0" width="90" height="190" fill="url(#sh)"/></g>
</g></svg>